name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Check the minimum identity version
        run: |
          npm install --no-save --package-lock=false agentic-identity@0.9.0
          npm run ci:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-run
          path: e2e-artifacts/
          if-no-files-found: ignore

  firestore-emulator:
    runs-on: ubuntu-latest
    env:
      REQUIRE_FIRESTORE_EMULATOR: "1"
      FIREBASE_ANALYTICS_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run the storage suite on the Firestore emulator
        run: npx --yes firebase-tools@14.27.0 emulators:exec --only firestore --project demo-contract "npx vitest run src/firestore/firestore.test.ts"
